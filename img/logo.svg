<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Malva Brunch" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Logo de Malva Brunch: monograma M en dorado y malva con una hoja -->
  <rect width="100" height="100" fill="#efedea"/>
  <!-- Hoja -->
  <path d="M50 30c-6.5-4-7.5-10.5-.5-16 6.5 5 6.5 11.5.5 16z" fill="#b8975a"/>
  <path d="M50 29.5c-.2-5-.3-10-.5-15" fill="none" stroke="#efedea" stroke-width="1"/>
  <!-- M: mitad izquierda dorada, mitad derecha malva (patas gruesas, diagonales finas) -->
  <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M32 72 34.5 36" stroke="#b8975a" stroke-width="7"/>
    <path d="M33.5 36 50 67" stroke="#b8975a" stroke-width="3.4"/>
    <path d="M50 67 66.5 36" stroke="#5f4a6e" stroke-width="3.4"/>
    <path d="M65.5 36 68 72" stroke="#5f4a6e" stroke-width="7"/>
    <!-- Remates -->
    <path d="M25.5 73.5h13" stroke="#b8975a" stroke-width="2.4"/>
    <path d="M61.5 73.5h13" stroke="#5f4a6e" stroke-width="2.4"/>
    <path d="M30 35.5h8" stroke="#b8975a" stroke-width="2.4"/>
    <path d="M62 35.5h8" stroke="#5f4a6e" stroke-width="2.4"/>
  </g>
  <!-- Filigrana -->
  <path d="M26 80.5c9 3.5 19 4.5 24 1.8 5 2.7 15 1.7 24-1.8" fill="none" stroke="#b8975a" stroke-width="1.4" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
